name: rust-v1
description: Rust stable toolchain with clippy and rustfmt, plus the cargo build cache
runs:
  using: composite
  steps:
    # Third-party actions are pinned to a commit, never to a tag
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
